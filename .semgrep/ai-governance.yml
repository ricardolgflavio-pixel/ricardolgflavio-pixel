rules:
  - id: autotech.llm-output-to-code-execution
    languages: [python]
    severity: ERROR
    message: >-
      Saída de LLM/agente alimentando eval/exec (OWASP LLM05:2025 - Improper Output
      Handling, CWE-95). Nunca execute texto gerado por modelo; use despacho
      por tabela de funções permitidas e valide com Pydantic.
    metadata:
      cwe: "CWE-95"
      owasp: "LLM05:2025 / A03:2021"
      category: security
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)

  - id: autotech.llm-output-to-shell
    languages: [python]
    severity: ERROR
    message: >-
      Comando de shell com argumento dinâmico (CWE-78). Em agentes de IA, a
      saída do modelo é entrada não confiável: use lista de argumentos fixa e
      shell=False.
    metadata:
      cwe: "CWE-78"
      owasp: "LLM05:2025 / A03:2021"
      category: security
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)

  - id: autotech.sql-string-building
    languages: [python]
    severity: ERROR
    message: >-
      SQL montado por interpolação/concatenação (CWE-89). Utilize consultas
      parametrizadas (%(nome)s) - inclusive nas buscas vetoriais do pgvector.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      category: security
    pattern-either:
      - pattern: $CUR.execute(f"...", ...)
      - pattern: $CUR.execute("..." + $X, ...)
      - pattern: $CUR.execute("..." % $X, ...)
      - pattern: $CUR.execute("...".format(...), ...)

  - id: autotech.tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: Verificação TLS desabilitada (CWE-295). Remova verify=False.
    metadata:
      cwe: "CWE-295"
      owasp: "A02:2021"
      category: security
    pattern: $CLIENT.$METHOD(..., verify=False, ...)

  - id: autotech.compliance-ip-blocked-proprietary-source
    languages: [python]
    severity: ERROR
    message: >-
      Referência a base proprietária fechada (Doutor-IE/Simplo). A arquitetura
      proíbe scraping e ingestão dessas fontes (Lei 9.609/98, Lei 9.610/98).
      Use apenas catálogos abertos, padrões SAE/ISO e telemetria própria.
    metadata:
      category: compliance
      law: "Lei 9.609/98; Lei 9.610/98"
    pattern-regex: (?i)(doutor-?ie\.com|simplo\.com)

  - id: autotech.compliance-http-scraper-library
    languages: [python]
    severity: WARNING
    message: >-
      Biblioteca de scraping importada. Em pipelines de ingestão RAG, coleta
      automatizada exige aprovação do Compliance e verificação de termos de
      uso e robots.txt; prefira download oficial de catálogo aberto.
    metadata:
      category: compliance
      law: "Lei 9.610/98"
    pattern-either:
      - pattern: import scrapy
      - pattern: from scrapy import $X
      - pattern: from bs4 import $X
      - pattern: import selenium
      - pattern: from selenium import $X
      - pattern: from playwright.sync_api import $X

  - id: autotech.pydantic-extra-allow
    languages: [python]
    severity: WARNING
    message: >-
      Modelo Pydantic aceitando campos extras. Em fronteiras de confiança
      (API, agentes, ingestão) use extra="forbid" (Security by Design).
    metadata:
      cwe: "CWE-20"
      owasp: "A04:2021"
      category: security
    pattern: ConfigDict(..., extra="allow", ...)
